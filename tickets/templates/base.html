<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Tickets{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'lista_tickets' %}">
                <span>🎫</span> Sistema de Tickets
            </a>
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-2">Hola, {{ user.get_username }}</span>
                    <a href="{% url 'crear_ticket_form' %}" class="btn btn-sm btn-light text-primary">+ Nuevo ticket</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-light">Cerrar sesión</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-sm btn-light">Iniciar sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block contenido %}{% endblock %}
    </div>

</body>
</html>
