<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'tickets/css/styles.css' %}">
</head>
<body class="login-page">
<main class="login-card">
    <div class="app-brand mb-4">
        <span class="brand-mark" aria-hidden="true">ST</span>
        <span><strong>Soporte</strong><small>Sistema de Tickets</small></span>
    </div>
    <h1 class="mb-2">Iniciar sesión</h1>
    <p class="text-muted mb-4">Accede a tu centro de atención.</p>
    {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100 mt-2" type="submit">Entrar al sistema</button>
    </form>
</main>
</body>
</html>
