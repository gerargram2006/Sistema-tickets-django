<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">
    <h1 class="h3 mb-4">Sistema de Tickets</h1>
    {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="id_username">Usuario</label>
            {{ form.username }}
        </div>
        <div class="mb-3">
            <label class="form-label" for="id_password">Contraseña</label>
            {{ form.password }}
        </div>
        <button class="btn btn-primary" type="submit">Iniciar sesión</button>
    </form>
</div>
</body>
</html>
