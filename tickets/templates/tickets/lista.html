<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cola de Atención de Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 700px;">

    <h1 class="mb-4">Turnos de Atención <span class="text-muted fs-4">({{ estado_actual|title }})</span></h1>
    <a href="{% url 'crear_ticket_form' %}" class="btn btn-success mb-3">+ Nuevo ticket</a>

    <div class="mb-4" style="max-width: 250px;">
        <label for="filtro-estado" class="form-label text-secondary">Filtrar por estado:</label>
        <select id="filtro-estado" class="form-select" onchange="location.href='?estado=' + this.value">
            <option value="Pendiente" {% if estado_actual == 'Pendiente' %}selected{% endif %}>Pendiente</option>
            <option value="En progreso" {% if estado_actual == 'En progreso' %}selected{% endif %}>En Progreso</option>
            <option value="Completado" {% if estado_actual == 'Completado' %}selected{% endif %}>Completado</option>
        </select>
    </div>

    <ol class="list-group list-group-numbered">
        {% for ticket in tickets %}
            <li class="list-group-item d-flex justify-content-between align-items-start">
                <div class="ms-2 me-auto">
                    <div class="fw-bold">{{ ticket.titulo }}</div>
                    Asignado a: {{ ticket.agente_asignado|default:"Nadie" }}
                    <br>
                    <a href="{% url 'detalle_ticket' ticket.id %}">Ver detalle</a>
                </div>
            </li>
        {% empty %}
            <li class="list-group-item">
                No hay tickets en estado "{{ estado_actual }}" en la cola.
            </li>
        {% endfor %}
    </ol>

</div>
</body>
</html>
