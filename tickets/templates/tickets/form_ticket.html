{% extends "tickets/base.html" %}

{% block titulo %}{{ titulo_pagina }}{% endblock %}

{% block contenido %}
<section class="page-header">
    <div>
        <span class="eyebrow">Gestión de solicitudes</span>
        <h1>{{ titulo_pagina }}</h1>
        <p>Completa la información para priorizar y asignar correctamente la atención.</p>
    </div>
</section>
<div class="surface-card" style="max-width: 760px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4">Guardar ticket</button>
                <a href="{% url 'lista_tickets' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
