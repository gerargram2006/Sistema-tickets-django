<!DOCTYPE html>
<html>
<head>
    <title>Detalle de Ticket #{{ ticket.id }}</title>
</head>
<body>
    <h1>{{ ticket.titulo }}</h1>
    <p><strong>Estado:</strong> {{ ticket.estado }}</p>
    <p><strong>Agente:</strong> {{ ticket.agente_asignado }}</p>
    <p><strong>Descripción:</strong> {{ ticket.descripcion }}</p>
    <br>
    <a href="{% url 'lista_tickets' %}">Volver a la cola</a>
</body>
</html>
