<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Ticket #{{ ticket.id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 700px;">

    <div class="card">
        <div class="card-body">
            <h1 class="card-title h3">{{ ticket.titulo }}</h1>
            <p class="card-text"><strong>Estado:</strong> {{ ticket.estado }}</p>
            <p class="card-text"><strong>Agente:</strong> {{ ticket.agente_asignado|default:"Nadie" }}</p>
            <p class="card-text"><strong>Descripción:</strong> {{ ticket.descripcion }}</p>
        </div>
    </div>

    <a href="{% url 'lista_tickets' %}" class="btn btn-outline-secondary mt-4">&larr; Volver a la cola</a>

</div>
</body>
</html>
