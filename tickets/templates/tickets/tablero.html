{% extends "tickets/base.html" %}

{% block contenido %}
<div class="container py-4">
    <h1 class="mb-4">Ranking de agentes</h1>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Puesto</th>
                <th>Agente</th>
                <th>Tickets resueltos</th>
            </tr>
        </thead>
        <tbody>
            {% for fila in ranking %}
            <tr>
                <td>{{ fila.puesto }}</td>
                <td>{{ fila.agente }}</td>
                <td><span class="badge bg-success">{{ fila.resueltos }}</span></td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="text-muted">No hay agentes en el grupo Agente.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
